[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: быстро выполнимые модульные тесты
    integration: интеграционные тесты
    security: тесты безопасности
    performance: бенчмарки производительности
