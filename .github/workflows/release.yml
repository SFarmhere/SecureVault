name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # ЗАВИСИМОСТИ
      # ============================================================

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev \
            pcscd \
            pkg-config \
            libssl-dev \
            libp11-dev \
            libudev-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install \
            pcsc-lite \
            pkg-config \
            openssl
          echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/pcsc-lite/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Setup vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install pcsc-lite:x64-windows
          .\vcpkg install openssl:x64-windows
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV

      # ============================================================
      # КОНФИГУРАЦИЯ
      # ============================================================

      - name: Configure CMake (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build -S native/pkcs11_module \
            -DCMAKE_BUILD_TYPE=Release \
            -DSECUREVAULT_ENABLE_TESTING=OFF \
            -DSECUREVAULT_ENABLE_PCSC=ON

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -B build -S native/pkcs11_module -DCMAKE_BUILD_TYPE=Release -DSECUREVAULT_ENABLE_TESTING=OFF -DSECUREVAULT_ENABLE_PCSC=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ============================================================
      # СБОРКА
      # ============================================================

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake --build build --config Release --parallel

      # ============================================================
      # АРТЕФАКТЫ
      # ============================================================

      - name: Archive artifacts (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: securevault-${{ matrix.os }}
          path: |
            build/lib*.so
            build/lib*.a
            build/lib*.dylib
            build/*.h
          retention-days: 30

      - name: Archive artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: securevault-windows
          path: |
            build/Release/*.dll
            build/Release/*.exe
            build/Release/*.lib
            build/Release/*.pdb
          retention-days: 30

      # ============================================================
      # СОЗДАНИЕ RELEASE (опционально)
      # ============================================================

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/lib*.so
            build/Release/*.dll
            build/lib*.dylib
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}